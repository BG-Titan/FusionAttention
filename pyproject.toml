[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionattn"
version = "0.1.0"
description = "CUDA-core FA2 paged attention backend for vLLM (Pascal sm_61, no Tensor Cores)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.entry-points."vllm.general_plugins"]
fusionattn = "fusionattn.plugin:load"

[tool.setuptools]
packages = ["fusionattn"]

[tool.setuptools.package-data]
fusionattn = ["*.so"]
